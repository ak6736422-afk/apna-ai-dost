<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation Maker - Apna AI Dost</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #cbd5e1; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
        .item-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .item-row input { font-size: 0.9rem; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        .btn-add { background: #0284c7; color: white; }
        .btn-print { background: #16a34a; color: white; margin-top: 15px; }
        .btn-back { background: #475569; color: white; margin-top: 10px; text-decoration: none; display: block; text-align: center; line-height: 40px; border-radius: 6px; }
        .total-box { text-align: right; font-size: 1.2rem; font-weight: bold; margin-top: 15px; color: #38bdf8; border-top: 1px solid #334155; padding-top: 10px; }
        
        @media print {
            body { background: white; color: black; padding: 0; }
            .container { border: none; background: white; color: black; width: 100%; max-width: 100%; }
            input { border: none; background: transparent; color: black; padding: 2px; }
            .btn, .btn-back { display: none; }
            h2 { color: black; }
            .total-box { color: black; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Quotation Maker</h2>
    
    <div class="form-group">
        <label>Grahak Ka Naam (Customer Name):</label>
        <input type="text" id="custName" placeholder="Naam likhein">
    </div>
    
    <div class="form-group">
        <label>Mobile Number:</label>
        <input type="tel" id="custPhone" placeholder="Mobile number likhein">
    </div>

    <div class="form-group">
        <label>Tareekh (Date):</label>
        <input type="date" id="quoteDate">
    </div>

    <hr style="border-color: #334155; margin: 15px 0;">

    <label>Samaan / Sewa (Items):</label>
    <div id="itemList">
        <div class="item-row">
            <input type="text" placeholder="Item Name" style="flex: 2;" class="item-name">
            <input type="number" placeholder="Qty" style="flex: 1;" class="item-qty" oninput="calculateTotal()">
            <input type="number" placeholder="Rate (₹)" style="flex: 1;" class="item-price" oninput="calculateTotal()">
        </div>
    </div>

    <button class="btn btn-add" onclick="addItem()">+ Naya Item Jodein</button>

    <div class="total-box">
        Kul Rashi (Total): ₹<span id="grandTotal">0</span>
    </div>

    <button class="btn btn-print" onclick="window.print()">Print / Save PDF</button>
    <a href="index.html" class="btn-back">← Main Website Par Jayein</a>
</div>

<script>
    document.getElementById('quoteDate').valueAsDate = new Date();

    function addItem() {
        let div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `
            <input type="text" placeholder="Item Name" style="flex: 2;" class="item-name">
            <input type="number" placeholder="Qty" style="flex: 1;" class="item-qty" oninput="calculateTotal()">
            <input type="number" placeholder="Rate (₹)" style="flex: 1;" class="item-price" oninput="calculateTotal()">
        `;
        document.getElementById('itemList').appendChild(div);
    }

    function calculateTotal() {
        let qtys = document.getElementsByClassName('item-qty');
        let prices = document.getElementsByClassName('item-price');
        let total = 0;
        
        for(let i = 0; i < qtys.length; i++) {
            let q = parseFloat(qtys[i].value) || 0;
            let p = parseFloat(prices[i].value) || 0;
            total += (q * p);
        }
        
        document.getElementById('grandTotal').innerText = total;
    }
</script>

</body>
</html>
