
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apna AI Dost</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .top-bar { width: 100%; max-width: 500px; margin-bottom: 12px; display: flex; justify-content: flex-end; }
        .tool-btn { background-color: #16a34a; color: #ffffff; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        .chat-container { width: 100%; max-width: 500px; height: 75vh; background-color: #1e293b; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #334155; }
        .chat-header { background-color: #0284c7; color: #ffffff; padding: 16px 20px; text-align: center; font-size: 1.2rem; font-weight: 600; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
        .bot-message { background-color: #334155; color: #f8fafc; align-self: flex-start; }
        .user-message { background-color: #0284c7; color: #ffffff; align-self: flex-end; }
        .input-area { display: flex; padding: 12px; background-color: #0f172a; gap: 10px; border-top: 1px solid #334155; }
        .input-area input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background-color: #1e293b; color: #ffffff; outline: none; }
        .input-area button { background-color: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="quotation.html" class="tool-btn">📄 Quotation Maker</a>
    </div>

    <div class="chat-container">
        <div class="chat-header">Apna AI Dost</div>
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">Namaste! Main aapka Apna AI Dost hoon. Main aapki kya madad kar sakta hoon?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Apna message likhein..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Bhejen</button>
        </div>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function getBotResponse(msg) {
            let text = msg.toLowerCase();
            
            if (text.includes("hi") || text.includes("hello") || text.includes("namaste")) {
                return "Namaste! Aap kaise hain? Main aapki business ya coding mein kya madad kar sakta hoon?";
            } else if (text.includes("good morning") || text.includes("morning")) {
                return "Good Morning! Aapka din shubh ho. Aaj kya khas kaam kar rahe hain?";
            } else if (text.includes("business") || text.includes("vyapar") || text.includes("kaam") || text.includes("madad")) {
                return "Haan bilkul! Main aapke business, export, quotation maker aur marketing mein poori madad kar sakta hoon. Aap apna sawal puchein!";
            } else if (text.includes("quotation") || text.includes("bill") || text.includes("rate")) {
                return "Aap upar diye gaye '📄 Quotation Maker' button par click karke aasani se quotation ya bill bana sakte hain!";
            } else if (text.includes("kaise ho") || text.includes("kaisa hai")) {
                return "Main bilkul badhiya hoon! Aap batayein, aapka kaam kaisa chal raha hai?";
            } else if (text.includes("thanks") || text.includes("dhanyawad") || text.includes("shukriya")) {
                return "Aapka bahut bahut swagat hai! Mujhase kabhi bhi sawal pooch sakte hain.";
            } else {
                return "Bahut achha sawal hai! Main is par aapki poori madad karne ke liye tayar hoon. Batayein isme aapko kya jaankari chahiye?";
            }
        }

        function sendMessage() {
            let input = document.getElementById("userInput");
            let message = input.value.trim();
            if (message !== "") {
                let chatBox = document.getElementById("chatBox");
                
                // Add User Message
                let userDiv = document.createElement("div");
                userDiv.className = "message user-message";
                userDiv.innerText = message;
                chatBox.appendChild(userDiv);
                
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
                
                // Add AI Smart Response
                setTimeout(() => {
                    let botDiv = document.createElement("div");
                    botDiv.className = "message bot-message";
                    botDiv.innerText = getBotResponse(message);
                    chatBox.appendChild(botDiv);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 800);
            }
        }
    </script>
</body>
</html>
