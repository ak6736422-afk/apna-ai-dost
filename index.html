<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apna AI Dost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chat-container { height: calc(100vh - 200px); }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen">

    <header class="bg-indigo-700 text-white p-3 shadow flex justify-between items-center">
        <h1 class="text-lg font-bold"><i class="fa-solid fa-robot text-yellow-300"></i> Apna AI Dost</h1>
        <button onclick="toggleApiKeyModal()" class="text-xs bg-indigo-900 hover:bg-indigo-800 px-3 py-1 rounded-full border border-indigo-400 font-semibold">
            <i class="fa-solid fa-key text-yellow-400 mr-1"></i> API Key
        </button>
    </header>

    <main class="max-w-md mx-auto p-3">
        <div id="chat-box" class="chat-container bg-white rounded-xl p-3 overflow-y-auto mb-3 flex flex-col gap-3 shadow-inner">
            <div class="bg-indigo-50 border p-3 rounded-lg text-xs text-indigo-900">
                👋 <b>नमस्ते! मैं आपका Apna AI Dost हूँ।</b><br>
                गूगल वेब ऐप ब्रिज के साथ आपका AI तैयार है! ऊपर **API Key** बटन दबाकर सेटिंग्स भरें।
            </div>
        </div>

        <div class="bg-white p-2 rounded-xl shadow border flex gap-2">
            <input type="text" id="user-input" placeholder="यहाँ सवाल लिखें..." class="flex-1 text-sm bg-slate-50 border rounded-lg px-3 py-2 outline-none" onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </main>

    <!-- Modal for API & Script URL -->
    <div id="api-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-sm w-full p-4 shadow-xl space-y-3">
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                <i class="fa-solid fa-gear text-indigo-600"></i> Google Script & Key सेट करें
            </h3>
            <div>
                <label class="text-[10px] text-slate-500 font-bold block mb-1">GOOGLE SCRIPT WEB APP URL:</label>
                <input type="text" id="script-url-input" placeholder="https://script.google.com/macros/s/.../exec" class="w-full p-2 border rounded text-xs">
            </div>
            <div>
                <label class="text-[10px] text-slate-500 font-bold block mb-1">GEMINI API KEY (AIzaSy...):</label>
                <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full p-2 border rounded text-xs">
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="toggleApiKeyModal()" class="px-3 py-1.5 text-xs bg-slate-200 rounded">रद्द करें</button>
                <button onclick="saveSettings()" class="px-3 py-1.5 text-xs bg-indigo-600 text-white rounded font-medium">सुरक्षित करें</button>
            </div>
        </div>
    </div>

    <script>
        function toggleApiKeyModal() {
            const modal = document.getElementById('api-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
            if(!modal.classList.contains('hidden')) {
                document.getElementById('script-url-input').value = localStorage.getItem('gas_script_url') || '';
                document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key') || '';
            }
        }

        function saveSettings() {
            const url = document.getElementById('script-url-input').value.trim();
            const key = document.getElementById('api-key-input').value.trim();
            if(url) localStorage.setItem('gas_script_url', url);
            if(key) localStorage.setItem('gemini_api_key', key);
            alert('सेटिंग्स सुरक्षित हो गईं!');
            toggleApiKeyModal();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if(!message) return;

            const scriptUrl = localStorage.getItem('gas_script_url');
            const apiKey = localStorage.getItem('gemini_api_key');

            if(!scriptUrl || !apiKey) {
                alert('कृपया ऊपर API Key बटन दबाकर Script URL और API Key दोनों डालें!');
                toggleApiKeyModal();
                return;
            }

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="bg-indigo-600 text-white p-3 rounded-xl max-w-[85%] ml-auto text-sm shadow">${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="bg-slate-200 text-slate-700 p-3 rounded-xl max-w-[85%] mr-auto text-xs flex items-center gap-2">
                <i class="fa-solid fa-spinner fa-spin text-indigo-600"></i> AI जवाब तैयार कर रहा है...
            </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ text: message, apiKey: apiKey })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if(data.reply) {
                    chatBox.innerHTML += `<div class="bg-white border p-3 rounded-xl max-w-[85%] mr-auto text-sm shadow whitespace-pre-wrap">${data.reply}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="bg-red-50 text-red-600 p-3 rounded-xl max-w-[85%] mr-auto text-xs border border-red-200">त्रुटि: ${JSON.stringify(data)}</div>`;
                }
            } catch(e) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="bg-red-50 text-red-600 p-3 rounded-xl max-w-[85%] mr-auto text-xs border border-red-200">कनेक्शन एरर: ${e.toString()}</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
