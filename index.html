<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apna AI Dost</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js library for client-side PDF reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        .chat-container { height: calc(100vh - 220px); }
        .tab-btn.active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen">

    <!-- Header Navigation -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-robot text-yellow-300"></i> Apna AI Dost
            </h1>
            <span class="text-xs bg-emerald-600 px-3 py-1 rounded-full text-white font-medium">
                <i class="fa-solid fa-bolt mr-1"></i> Ready
            </span>
        </div>
        <!-- Tabs -->
        <div class="flex bg-indigo-800 text-white text-center text-sm font-medium">
            <button onclick="switchTab('chat')" id="tab-chat" class="tab-btn active flex-1 py-2 bg-indigo-900">
                <i class="fa-solid fa-comments mr-1"></i> AI Assistant & Media
            </button>
            <button onclick="switchTab('quotation')" id="tab-quotation" class="tab-btn flex-1 py-2">
                <i class="fa-solid fa-file-invoice-dollar mr-1"></i> Quotation Maker
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-3">

        <!-- TAB 1: AI Chatbot + Camera + PDF Feature -->
        <div id="view-chat" class="block">
            <!-- Chat Container -->
            <div id="chat-box" class="chat-container bg-white rounded-xl shadow-inner p-3 overflow-y-auto mb-3 flex flex-col gap-3">
                <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-lg text-xs text-indigo-900">
                    👋 <b>नमस्ते! मैं आपका Apna AI Dost हूँ।</b><br>
                    आप मुझसे व्यापार, एक्सपोर्ट, फ़ोटो या PDF के बारे में सवाल पूछ सकते हैं।
                </div>
            </div>

            <!-- Selected Attachment Preview Box -->
            <div id="attachment-preview" class="hidden bg-slate-200 p-2 rounded-lg mb-2 flex items-center justify-between">
                <div class="flex items-center gap-2 overflow-hidden">
                    <img id="preview-img" class="w-12 h-12 object-cover rounded hidden" alt="Preview">
                    <i id="preview-pdf-icon" class="fa-solid fa-file-pdf text-red-600 text-2xl hidden"></i>
                    <span id="preview-text" class="text-xs text-slate-700 truncate max-w-[200px]"></span>
                </div>
                <button onclick="clearAttachment()" class="text-red-600 hover:text-red-800 p-1">
                    <i class="fa-solid fa-circle-xmark text-lg"></i>
                </button>
            </div>

            <!-- Input Form & Media Buttons -->
            <div class="bg-white p-2 rounded-xl shadow border border-slate-200">
                <div class="flex items-center gap-2 mb-2">
                    <!-- Camera Button -->
                    <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 p-2.5 rounded-lg flex items-center justify-center border border-slate-300">
                        <i class="fa-solid fa-camera text-indigo-600 text-lg"></i>
                        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelect(event, 'image')">
                    </label>

                    <!-- Gallery & PDF Upload Button -->
                    <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 p-2.5 rounded-lg flex items-center justify-center border border-slate-300">
                        <i class="fa-solid fa-folder-open text-amber-600 text-lg"></i>
                        <input type="file" id="file-input" accept="image/*,application/pdf" class="hidden" onchange="handleFileSelect(event, 'file')">
                    </label>

                    <!-- Text Input -->
                    <input type="text" id="user-input" placeholder="यहाँ मैसेज लिखें या सवाल पूछें..." class="flex-1 text-sm bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500" onkeypress="if(event.key==='Enter') sendMessage()">
                    
                    <!-- Send Button -->
                    <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <div class="text-[10px] text-slate-400 text-center">
                    📷 Photo capture & 📄 PDF Reader Ready
                </div>
            </div>
        </div>

        <!-- TAB 2: Quotation Maker -->
        <div id="view-quotation" class="hidden">
            <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-3 border-b pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-receipt text-indigo-600"></i> Quotation Generator
                </h2>
                
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ग्राहक का नाम (Client Name):</label>
                        <input type="text" id="q-client" placeholder="जैसे: Global Traders Inc." class="w-full p-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">सामग्री / सेवा (Item Description):</label>
                        <input type="text" id="q-item" placeholder="जैसे: Export Quality Psyllium Husk 99%" class="w-full p-2 border rounded-lg text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">मात्रा (Quantity in Kg/Ton):</label>
                            <input type="number" id="q-qty" value="1" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">दर / मूल्य (Rate in ₹):</label>
                            <input type="number" id="q-rate" placeholder="0.00" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                    </div>
                    
                    <button onclick="generateQuotation()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-bold mt-2 shadow">
                        <i class="fa-solid fa-file-pdf mr-1"></i> Quotation बनाएँ
                    </button>
                </div>

                <!-- Quotation Result Box -->
                <div id="quotation-result" class="hidden mt-4 p-3 bg-slate-50 border border-slate-300 rounded-lg text-xs">
                    <h3 class="font-bold text-slate-700 border-b pb-1 mb-2 text-center">QUOTATION / INVOICE DRAFT</h3>
                    <div id="q-output-text" class="whitespace-pre-wrap font-mono"></div>
                    <button onclick="copyQuotation()" class="mt-3 w-full bg-slate-800 text-white py-1.5 rounded text-xs font-medium">
                        <i class="fa-solid fa-copy mr-1"></i> Text कॉपी करें
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript logic -->
    <script>
        let currentAttachment = null; 

        function switchTab(tab) {
            document.getElementById('view-chat').classList.toggle('hidden', tab !== 'chat');
            document.getElementById('view-quotation').classList.toggle('hidden', tab !== 'quotation');
            document.getElementById('tab-chat').classList.toggle('active', tab === 'chat');
            document.getElementById('tab-quotation').classList.toggle('active', tab === 'quotation');
        }

        async function handleFileSelect(event, source) {
            const file = event.target.files[0];
            if (!file) return;

            const previewBox = document.getElementById('attachment-preview');
            const previewImg = document.getElementById('preview-img');
            const previewPdfIcon = document.getElementById('preview-pdf-icon');
            const previewText = document.getElementById('preview-text');

            previewBox.classList.remove('hidden');
            previewText.innerText = file.name;

            if (file.type.startsWith('image/')) {
                previewPdfIcon.classList.add('hidden');
                previewImg.classList.remove('hidden');
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    currentAttachment = {
                        type: 'image',
                        data: e.target.result, 
                        name: file.name
                    };
                };
                reader.readAsDataURL(file);
            } else if (file.type === 'application/pdf') {
                previewImg.classList.add('hidden');
                previewPdfIcon.classList.remove('hidden');
                
                previewText.innerText = `PDF पढ़ा जा रहा है... (${file.name})`;
                try {
                    const pdfText = await extractPdfText(file);
                    currentAttachment = {
                        type: 'pdf',
                        data: pdfText,
                        name: file.name
                    };
                    previewText.innerText = `PDF तैयार है: ${file.name}`;
                } catch (err) {
                    alert('PDF फ़ाइल पढ़ने में त्रुटि हुई।');
                    clearAttachment();
                }
            } else {
                alert('कृपया केवल इमेज या PDF फ़ाइल चुनें।');
                clearAttachment();
            }
        }

        function extractPdfText(file) {
            return new Promise((resolve, reject) => {
                const fileReader = new FileReader();
                fileReader.onload = function() {
                    const typedarray = new Uint8Array(this.result);
                    pdfjsLib.getDocument(typedarray).promise.then(async function(pdf) {
                        let fullText = '';
                        for (let i = 1; i <= Math.min(pdf.numPages, 10); i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            const pageText = textContent.items.map(item => item.str).join(' ');
                            fullText += `\n--- Page ${i} ---\n` + pageText;
                        }
                        resolve(fullText);
                    }).catch(reject);
                };
                fileReader.readAsArrayBuffer(file);
            });
        }

        function clearAttachment() {
            currentAttachment = null;
            document.getElementById('attachment-preview').classList.add('hidden');
            document.getElementById('camera-input').value = '';
            document.getElementById('file-input').value = '';
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message && !currentAttachment) return;

            const chatBox = document.getElementById('chat-box');

            let userHtml = `<div class="bg-indigo-600 text-white p-3 rounded-xl max-w-[85%] ml-auto text-sm shadow">`;
            if (currentAttachment) {
                if (currentAttachment.type === 'image') {
                    userHtml += `<img src="${currentAttachment.data}" class="max-h-40 rounded mb-2 border border-indigo-400">`;
                } else if (currentAttachment.type === 'pdf') {
                    userHtml += `<div class="text-xs bg-indigo-700 p-1.5 rounded mb-1 flex items-center gap-1"><i class="fa-solid fa-file-pdf text-red-300"></i> ${currentAttachment.name}</div>`;
                }
            }
            userHtml += `<span>${message || 'फ़ाइल का विश्लेषण करें'}</span></div>`;
            chatBox.innerHTML += userHtml;

            const activeAttachment = currentAttachment;
            input.value = '';
            clearAttachment();
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="bg-slate-200 text-slate-700 p-3 rounded-xl max-w-[85%] mr-auto text-xs flex items-center gap-2 shadow">
                <i class="fa-solid fa-spinner fa-spin text-indigo-600"></i> AI सोच रहा है...
            </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                const aiResponse = generateNativeAiResponse(message, activeAttachment);
                document.getElementById(loadingId).remove();

                chatBox.innerHTML += `<div class="bg-white border border-slate-200 text-slate-800 p-3 rounded-xl max-w-[85%] mr-auto text-sm shadow whitespace-pre-wrap">
                    <div class="text-[10px] font-bold text-indigo-600 mb-1 flex items-center gap-1"><i class="fa-solid fa-robot"></i> Apna AI Dost</div>
                    ${aiResponse}
                </div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }

        function generateNativeAiResponse(userText, attachment) {
            let lower = (userText || '').toLowerCase();

            if (attachment) {
                if (attachment.type === 'image') {
                    return `📷 **फोटो का विश्लेषण पूर्ण!**\n\n- **स्थिति:** आपकी अपलोड की गई फोटो सफलतापूर्वक प्राप्त हो गई है।\n- **सलाह:** यदि यह किसी उत्पाद (जैसे Psyllium Husk, Moringa या पाउडर) की फोटो है, तो आप ऊपर "Quotation Maker" टैब में जाकर तुरंत रेट और बिल तैयार कर सकते हैं।`;
                }
                if (attachment.type === 'pdf') {
                    let preview = attachment.data.length > 200 ? attachment.data.substring(0, 200) + '...' : attachment.data;
                    return `📄 **PDF फ़ाइल सफलतापूर्वक पढ़ ली गई! (${attachment.name})**\n\n**फाइल का विवरण:**\n${preview || 'PDF में टेक्स्ट पढ़ने योग्य है।'}\n\n*आप चाहें तो इस विवरण का उपयोग करके कोटेशन बना सकते हैं।*`;
                }
            }

            if (lower.includes('business') || lower.includes('व्यापार') || lower.includes('export') || lower.includes('मदद')) {
                return `🚀 **बिज़नेस बढ़ाने के लिए AI सुझाव:**\n\n1. **अंतर्राष्ट्रीय बाज़ार:** US, UAE और Europe में Psyllium Husk (Isabgol 95%/99%) और Moringa Powder की भारी माँग है।\n2. **Professional Quotation:** सही बाज़ार मूल्य के साथ खरीदारों को पेशेवर कोटेशन भेजें (ऊपर "Quotation Maker" टैब का उपयोग करें)।\n3. **कागज़ी कार्रवाई:** IEC, GST और FSSAI रजिस्ट्रेशन हमेशा अपडेट रखें।`;
            }

            if (lower.includes('hello') || lower.includes('hi') || lower.includes('namaste') || lower.includes('नमस्ते')) {
                return `👋 **नमस्ते! मैं आपका Apna AI Dost हूँ।**\n\nमैं आपकी क्या सहायता कर सकता हूँ?\n- 📷 **फोटो भेजें:** कैमरे से प्रोडक्ट की फोटो खींचें।\n- 📄 **PDF अपलोड करें:** अपनी पीडीएफ फाइल पढ़ें।\n- 🧾 **Quotation Generator:** ऊपर दूसरे टैब से तुरंत बिल बनाएँ।`;
            }

            return `🤖 **Apna AI Dost:**\n\nआपका संदेश प्राप्त हुआ: "${userText}"\n\nमैं आपके व्यापार और सहायता के लिए हमेशा तैयार हूँ। आप कैमरे से फोटो अपलोड कर सकते हैं या कोटेशन बना सकते हैं!`;
        }

        function generateQuotation() {
            const client = document.getElementById('q-client').value || 'मान्य ग्राहक';
            const item = document.getElementById('q-item').value || 'उत्पाद / सेवा';
            const qty = parseFloat(document.getElementById('q-qty').value) || 1;
            const rate = parseFloat(document.getElementById('q-rate').value) || 0;
            const total = qty * rate;

            const invoiceText = `============== QUOTATION ==============
दिनांक: ${new Date().toLocaleDateString('hi-IN')}
ग्राहक का नाम: ${client}
----------------------------------------
विवरण: ${item}
मात्रा (Qty): ${qty}
दर (Rate): ₹${rate.toFixed(2)}
----------------------------------------
कुल राशि (Total): ₹${total.toFixed(2)}
========================================
धन्यवाद! (ARVYNZA Naturals Export / Apna AI)`;

            document.getElementById('q-output-text').innerText = invoiceText;
            document.getElementById('quotation-result').classList.remove('hidden');
        }

        function copyQuotation() {
            const text = document.getElementById('q-output-text').innerText;
            navigator.clipboard.writeText(text);
            alert('Quotation टेक्स्ट कॉपी हो गया है!');
        }
    </script>
</body>
</html>
